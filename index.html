<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Suppress benign Vite HMR WebSocket connection logs in preview iframe
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args.length > 0) {
            var msg = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].message ? args[0].message : String(args[0]));
            if (msg.indexOf('WebSocket closed without opened') !== -1 || (msg.indexOf('[vite]') !== -1 && msg.indexOf('WebSocket') !== -1)) {
              return;
            }
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          var message = event && (event.message || (event.error && event.error.message)) || '';
          if (message.indexOf('WebSocket closed without opened') !== -1) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>MangaReader</title>
    <meta name="description" content="Aplicação para descoberta e leitura de mangás com suporte a múltiplas fontes, catálogo unificado e leitor avançado." />
    <meta property="og:title" content="MangaReader" />
    <meta property="og:description" content="Aplicação para descoberta e leitura de mangás com suporte a múltiplas fontes, catálogo unificado e leitor avançado." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MangaReader" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Stylized Open Manga Book and Crimson Bookmark -->
  <g transform="translate(256, 256)">
    <!-- Left page block -->
    <path d="M-150,90 C-150,90 -90,70 -10,95 L-10,-95 C-90,-120 -150,-100 -150,-100 Z" fill="url(#page-grad)" opacity="0.95"/>
    <path d="M-140,80 C-140,80 -85,62 -15,85 L-15,-85 C-85,-108 -140,-90 -140,-90 Z" fill="#ffffff"/>
    
    <!-- Manga action lines on left page -->
    <line x1="-120" y1="-50" x2="-35" y2="-50" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
    <line x1="-120" y1="-20" x2="-35" y2="-20" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
    <line x1="-120" y1="10" x2="-60" y2="10" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
    <line x1="-120" y1="40" x2="-45" y2="40" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>

    <!-- Right page block -->
    <path d="M150,90 C150,90 90,70 10,95 L10,-95 C90,-120 150,-100 150,-100 Z" fill="url(#page-grad)" opacity="0.95"/>
    <path d="M140,80 C140,80 85,62 15,85 L15,-85 C85,-108 140,-90 140,-90 Z" fill="#ffffff"/>

    <!-- Manga frame panels on right page -->
    <rect x="30" y="-75" width="95" height="60" rx="6" fill="#e4e4e7" stroke="#3f3f46" stroke-width="4"/>
    <rect x="30" y="-5" width="95" height="70" rx="6" fill="#e4e4e7" stroke="#3f3f46" stroke-width="4"/>

    <!-- Spine / Center Shadow -->
    <path d="M-10,95 C-5,90 5,90 10,95 L10,-95 C5,-100 -5,-100 -10,-95 Z" fill="#18181b"/>

    <!-- Crimson Rose ribbon / bookmark hanging down from the center -->
    <path d="M-8,-100 L8,-100 L8,135 L0,120 L-8,135 Z" fill="url(#rose-grad)"/>

    <!-- Lightning / speed dynamic badge -->
    <polygon points="120,-80 145,-125 105,-125 115,-155 75,-100 105,-100" fill="#f43f5e"/>
  </g>
</svg>
